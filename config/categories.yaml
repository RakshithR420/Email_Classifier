Phishing: "Suspicious or malicious emails attempting to steal credentials, financial information, personal data, or gain unauthorized access."
Job Search: "Emails related to job opportunities, recruiter outreach, interview invitations, job alerts, career fairs, or professional networking."
Applications: "Emails related to applications the user has submitted, such as job applications, university applications, memberships, services, or other application processes."
Orders: "Emails related to purchases and orders, including order confirmations, shipping updates, delivery notifications, cancellations, returns, and refunds."
Subscriptions: "Emails related to recurring subscriptions or services, including subscription confirmations, renewals, cancellations, billing reminders, and service updates."
Personal: "Personal communications from friends, family, acquaintances, or other individuals that are not primarily related to business, finance, shopping, or job searching."
Finance: "Emails related to banking, credit cards, payments, transactions, invoices, investments, insurance, loans, taxes, or other financial matters."
Promotions: "Marketing and promotional emails advertising products, services, discounts, sales, offers, newsletters, or promotional campaigns."
Other: "Legitimate emails that do not clearly fit into any of the other categories."
Job Result: "Emails related to the results of job applications, interviews, or assessments, including acceptance, rejection, feedback, or next steps."
Social Media: "Emails related to social media platforms, including notifications, friend requests, messages, updates, and activity alerts."
OTP: "Emails containing one-time passwords (OTPs) or verification codes for account authentication, password resets, or secure transactions."