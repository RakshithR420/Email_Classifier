# What the agent does for each category.
#   action: "label"   -> add the Gmail label
#   action: "archive" -> add the label (if given) and remove the email from the inbox
#   action: "none"    -> leave the email alone
# Every category in categories.yaml should have an entry here.

Phishing:
  action: "label"
  label: "AI/Phishing-Review"

Job Search:
  action: "label"
  label: "AI/Job Search"

Applications:
  action: "label"
  label: "AI/Applications"

Orders:
  action: "label"
  label: "AI/Orders"

Subscriptions:
  action: "label"
  label: "AI/Subscriptions"

Personal:
  action: "none"

Finance:
  action: "label"
  label: "AI/Finance"

Promotions:
  action: "archive"
  label: "AI/Promotions"

Other:
  action: "none"

Job Result:
  action: "label"
  label: "AI/Job Result"

Social Media:
  action: "label"
  label: "AI/Social Media"

OTP:
  action: "label"
  label: "AI/OTP"
